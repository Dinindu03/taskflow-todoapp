<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow dashboard" />
    <title>TaskFlow | Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <div class="min-h-screen lg:flex">
      <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 w-72 -translate-x-full border-r border-slate-200 bg-white p-6 transition-transform lg:static lg:translate-x-0">
        <div class="flex items-center justify-between">
          <a href="/dashboard.html" class="text-xl font-bold tracking-tight text-violet-700">TaskFlow</a>
          <button id="close-sidebar" type="button" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 lg:hidden" aria-label="Close navigation">✕</button>
        </div>
        <nav class="mt-10 space-y-2" aria-label="Main navigation">
          <a href="#overview" class="flex items-center rounded-xl bg-violet-50 px-4 py-3 font-semibold text-violet-700">Overview</a>
          <a href="#tasks" class="flex items-center rounded-xl px-4 py-3 text-slate-600 hover:bg-slate-50">My tasks</a>
        </nav>
        <div class="absolute bottom-6 left-6 right-6 border-t border-slate-100 pt-5">
          <p id="sidebar-user" class="truncate text-sm font-medium text-slate-800">Loading profile...</p>
          <button id="logout-button" type="button" class="mt-3 text-sm font-medium text-slate-500 hover:text-red-600">Sign out</button>
        </div>
      </aside>
      <div id="sidebar-backdrop" class="fixed inset-0 z-20 hidden bg-slate-900/30 lg:hidden"></div>

      <main class="min-w-0 flex-1">
        <header class="border-b border-slate-200 bg-white">
          <div class="flex items-center justify-between px-4 py-5 sm:px-8">
            <button id="open-sidebar" type="button" class="rounded-xl p-2 text-slate-600 hover:bg-slate-100 lg:hidden" aria-label="Open navigation">☰</button>
            <div class="hidden lg:block">
              <p class="text-sm font-medium text-slate-500">Workspace</p>
              <h1 class="text-xl font-semibold">Dashboard</h1>
            </div>
            <div class="ml-auto flex items-center gap-3">
              <span id="header-user" class="hidden text-sm font-medium text-slate-600 sm:inline">Loading...</span>
              <button id="header-logout" type="button" class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-50 lg:hidden">Sign out</button>
            </div>
          </div>
        </header>

        <div class="mx-auto max-w-7xl px-4 py-8 sm:px-8">
          <div id="dashboard-message" class="mb-6 hidden rounded-xl border px-4 py-3 text-sm" role="alert" aria-live="polite"></div>
          <section id="overview" class="mb-8">
            <p class="text-sm font-semibold uppercase tracking-wider text-violet-700">Overview</p>
            <div class="mt-2 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
              <div>
                <h2 class="text-3xl font-semibold tracking-tight">Your tasks</h2>
                <p class="mt-2 text-slate-600">Keep your priorities moving forward.</p>
              </div>
              <button id="new-task-button" type="button" class="rounded-xl bg-violet-700 px-5 py-3 font-semibold text-white shadow-sm hover:bg-violet-800 focus:outline-none focus:ring-4 focus:ring-violet-200">+ New task</button>
            </div>
          </section>

          <section id="stats" class="grid gap-4 sm:grid-cols-3" aria-label="Task statistics">
            <div class="rounded-2xl border border-slate-200 bg-white p-5"><p class="text-sm text-slate-500">Total tasks</p><p id="total-count" class="mt-2 text-3xl font-semibold">—</p></div>
            <div class="rounded-2xl border border-amber-200 bg-amber-50 p-5"><p class="text-sm text-amber-700">Pending</p><p id="pending-count" class="mt-2 text-3xl font-semibold text-amber-900">—</p></div>
            <div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-5"><p class="text-sm text-emerald-700">Completed</p><p id="completed-count" class="mt-2 text-3xl font-semibold text-emerald-900">—</p></div>
          </section>

          <section id="task-form-section" class="mt-8 hidden rounded-2xl border border-slate-200 bg-white p-5 sm:p-6">
            <div class="flex items-center justify-between">
              <h3 id="task-form-title" class="text-lg font-semibold">Create a task</h3>
              <button id="cancel-task-button" type="button" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100" aria-label="Close task form">✕</button>
            </div>
            <form id="task-form" class="mt-5 space-y-4" novalidate>
              <div>
                <label for="task-title" class="mb-2 block text-sm font-medium text-slate-700">Title</label>
                <input id="task-title" maxlength="200" required class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-violet-600 focus:ring-4 focus:ring-violet-100" placeholder="What needs to be done?" />
                <p id="task-title-error" class="mt-1 hidden text-sm text-red-600"></p>
              </div>
              <div>
                <label for="task-description" class="mb-2 block text-sm font-medium text-slate-700">Description <span class="font-normal text-slate-400">(optional)</span></label>
                <textarea id="task-description" maxlength="2000" rows="3" class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-violet-600 focus:ring-4 focus:ring-violet-100" placeholder="Add more details..."></textarea>
              </div>
              <div class="flex justify-end gap-3">
                <button id="cancel-task-button-bottom" type="button" class="rounded-xl px-4 py-2.5 font-semibold text-slate-600 hover:bg-slate-100">Cancel</button>
                <button id="save-task-button" type="submit" class="flex items-center gap-2 rounded-xl bg-violet-700 px-5 py-2.5 font-semibold text-white hover:bg-violet-800 disabled:opacity-70"><span id="save-task-label">Save task</span><span id="save-task-spinner" class="hidden h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"></span></button>
              </div>
            </form>
          </section>

          <section id="tasks" class="mt-8">
            <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
              <h3 class="text-xl font-semibold">Task list</h3>
              <div class="flex rounded-xl border border-slate-200 bg-white p-1" role="group" aria-label="Filter tasks">
                <button data-filter="all" type="button" class="filter-button rounded-lg bg-violet-100 px-3 py-1.5 text-sm font-semibold text-violet-700">All</button>
                <button data-filter="pending" type="button" class="filter-button rounded-lg px-3 py-1.5 text-sm font-semibold text-slate-500 hover:bg-slate-50">Pending</button>
                <button data-filter="completed" type="button" class="filter-button rounded-lg px-3 py-1.5 text-sm font-semibold text-slate-500 hover:bg-slate-50">Completed</button>
              </div>
            </div>
            <div id="task-loading" class="py-16 text-center text-slate-500">Loading your tasks...</div>
            <div id="empty-state" class="hidden rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-14 text-center"><p class="text-lg font-semibold">No tasks here yet</p><p class="mt-2 text-slate-500">Create a task to get started.</p></div>
            <div id="task-list" class="mt-4 space-y-3"></div>
          </section>
        </div>
      </main>
    </div>
    <script src="/src/js/dashboard.js" defer></script>
  </body>
</html>
